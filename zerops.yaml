zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm install
        - npm run build --prefix web
      deployFiles:
        - web/.next
        - web/public
        - web/package.json
        - web/next.config.js
        - node_modules
      cache: node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: "3000"
        NODE_ENV: "production"
        API_URL: "${api_apiUrl}"
      start: cd web && npm run start

  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm install
        - npm prune --omit=dev
      deployFiles:
        - api/src
        - api/package.json
        - node_modules
      cache: node_modules
    run:
      base: nodejs@22
      ports:
        - port: 4000
          httpSupport: true
      envVariables:
        PORT: "4000"
        NODE_ENV: "production"
        DATABASE_URL: "${db_connectionString}"
        ZEROPS_API_TOKEN: "${ZEROPS_API_TOKEN}"
        LLM_API_KEY: "${LLM_API_KEY}"
        GITHUB_TOKEN: "${GITHUB_TOKEN}"
      start: cd api && npm run start

  - setup: db
    run:
      base: postgresql@16

